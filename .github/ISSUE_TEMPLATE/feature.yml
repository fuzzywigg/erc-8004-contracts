name: Feature
description: New contract capability or standard extension
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Contract-Logic, Tests, Deployment, ABI, Docs, New]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options: [Backlog, Ready, "In Progress", Blocked]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What should this do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
